# LILITH 15B2b-B1b-3d: needrestart service-specific restart exclusion (DEV).
#
# Install path: /etc/needrestart/conf.d/lilith-authority-sensitive.conf
# (root:root 0644), by one owner-controlled step only. Runbook:
# docs/architecture/slice15b2b-b1b3d-current-runtime-baseline.md
#
# Purpose: after a package upgrade, needrestart must not restart these three
# authority-sensitive units by itself. It lists them under "Service restarts
# being deferred" instead. Security updates still install, and every other
# service keeps the distribution default. A deferred restart becomes owner
# maintenance: hold issuance, restart, run the read-only verifier, and accept
# a new incarnation baseline.
#
# This file grants no authority. It holds no key, credential, sudo rule, or
# command. It changes only needrestart's default restart selection for three
# exact systemd unit names, two of which do not exist yet.
#
# Syntax, as read from needrestart 3.6-7ubuntu4.5 on lilith-dev-01: the main
# needrestart.conf evals conf.d/*.conf as Perl, in sort order, after its own
# defaults. override_rc is a hash of regex => 0|1 matched against the unit
# name. These lines add keys; they never replace the default hash.
$nrconf{override_rc}{qr(^lilith-memory-broker\.service$)} = 0;
$nrconf{override_rc}{qr(^lilith-authority-dev\.service$)} = 0;
$nrconf{override_rc}{qr(^lilith-recovery-witness\.service$)} = 0;
