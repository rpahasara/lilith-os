# W-SEC-1: Cloudflare Tunnel runs only while the verified web service runs.
# Installed by install-release.sh as
#   /etc/systemd/system/cloudflared.service.d/10-lilith-web.conf
# (harmless before cloudflared is installed).
#
# - Requires + BindsTo: cloudflared cannot be active unless lilith-web.service is
#   active; it is stopped whenever lilith-web stops, fails or crashes.
# - After: lilith-web counts as started only after its ExecStartPre gate and its
#   ExecStartPost authentication health check succeed, so the tunnel process
#   starts only after authentication is verified.
# - Recovery: a stopped tunnel is started again by the periodic health check
#   (lilith-web-health.service) only when the web service is verified healthy
#   and cloudflared is enabled. Re-expose at once with `systemctl start
#   cloudflared` (it starts and verifies lilith-web first); keep it down with
#   `systemctl disable --now cloudflared`.
[Unit]
Requires=lilith-web.service
BindsTo=lilith-web.service
After=lilith-web.service
