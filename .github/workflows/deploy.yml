name: Deploy LILITH Core API

# Production deployment is owner-dispatched only (ADR-0005: Git-driven from protected main).
# Merges to main never start it; a dispatch is refused unless it is the exact approved main commit.
on:
  workflow_dispatch:
    inputs:
      approved_main_sha:
        description: "Exact protected-main SHA approved for this production deployment"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: lilith-core-api-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: lilith-agent-260823-27389
  GCP_ZONE: asia-southeast1-b
  GCP_INSTANCE: lilith-01
  GCP_WIF_PROVIDER: projects/763184673487/locations/global/workloadIdentityPools/github-actions/providers/github
  GCP_DEPLOY_SA: github-lilith-deployer@lilith-agent-260823-27389.iam.gserviceaccount.com
  LOCAL_APP: services/core-api/app.py
  LIVE_APP: /home/lilith/.hermes/lilith-os/api/app.py
  SERVICE_NAME: lilith-os-api.service

jobs:
  deploy:
    name: Deploy core API to GCP
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Refuse anything but the approved protected-main commit
        env:
          APPROVED_MAIN_SHA: ${{ inputs.approved_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = rpahasara
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$APPROVED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$APPROVED_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_MAIN_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate backend locally
        run: |
          python -m pip install --disable-pip-version-check -r services/core-api/requirements.txt
          python -m py_compile services/core-api/app.py
          python -m unittest discover -s services/core-api/tests -p "test_*.py"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify deployment identity
        run: |
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          gcloud compute instances describe "${GCP_INSTANCE}" --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" --format="value(name,status)"

      - name: Upload deployment candidate
        env:
          REMOTE_APP: /tmp/lilith-app-${{ github.sha }}.py
          REMOTE_SCRIPT: /tmp/lilith-deploy-core-api-${{ github.sha }}.sh
        run: |
          gcloud compute scp --quiet --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" --tunnel-through-iap "${LOCAL_APP}" "${GCP_INSTANCE}:${REMOTE_APP}"
          gcloud compute scp --quiet --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" --tunnel-through-iap scripts/deploy_core_api_remote.sh "${GCP_INSTANCE}:${REMOTE_SCRIPT}"

      - name: Deploy with production validation, health check, and rollback
        env:
          REMOTE_APP: /tmp/lilith-app-${{ github.sha }}.py
          REMOTE_SCRIPT: /tmp/lilith-deploy-core-api-${{ github.sha }}.sh
        run: |
          gcloud compute ssh "${GCP_INSTANCE}" --quiet --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" --tunnel-through-iap --command="sudo bash '${REMOTE_SCRIPT}' '${REMOTE_APP}' '${LIVE_APP}' '${SERVICE_NAME}'"

      - name: Final production verification
        run: |
          gcloud compute ssh "${GCP_INSTANCE}" --quiet --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" --tunnel-through-iap --command="curl -fsS http://127.0.0.1:8765/health && echo"
