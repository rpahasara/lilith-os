name: Memory Broker DEV Stage II runtime isolation (owner invoked)

on:
  workflow_dispatch:
    inputs:
      approved_stage:
        description: "Only B1B2B_II / ACTIVATE_AND_ISOLATION_TEST"
        required: true
        type: choice
        options:
          - B1B2B_II
      approved_release_sha:
        description: "Exact accepted Stage-I release SHA"
        required: true
        type: string
      owner_confirmation:
        description: "Enter: I AUTHORIZE B1B2B_II ACTIVATE_AND_ISOLATION_TEST"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/memory-broker-dev-stage2-runtime.yml"

permissions:
  contents: read

concurrency:
  group: lilith-memory-broker-dev-stage2-runtime
  cancel-in-progress: false

jobs:
  registration_audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out registration source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record exact registered workflow source
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          workflow=.github/workflows/memory-broker-dev-stage2-runtime.yml
          test -f "$workflow"
          {
            echo "EVENT=$GITHUB_EVENT_NAME"
            echo "REF=$GITHUB_REF"
            echo "SHA=$GITHUB_SHA"
            echo "WORKFLOW=$workflow"
            sha256sum "$workflow"
          } >> "$GITHUB_STEP_SUMMARY"

  activate_and_isolation_test:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'rpahasara' &&
      github.ref == 'refs/heads/main' &&
      inputs.approved_stage == 'B1B2B_II' &&
      inputs.approved_release_sha == '817a83e44cec8965479fd97fc30b7a0b3ae49ab2' &&
      inputs.owner_confirmation == 'I AUTHORIZE B1B2B_II ACTIVATE_AND_ISOLATION_TEST'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: lilith-agent-260823-27389
      GCP_ZONE: asia-southeast1-b
      GCP_INSTANCE: lilith-dev-01
      GCP_INSTANCE_ID: "7687007163730582258"
      GCP_WIF_PROVIDER: projects/763184673487/locations/global/workloadIdentityPools/github-actions/providers/github
      GCP_DEPLOY_SA: github-lilith-deployer@lilith-agent-260823-27389.iam.gserviceaccount.com
      RELEASE_SHA: "817a83e44cec8965479fd97fc30b7a0b3ae49ab2"
    steps:
      - name: Check out trusted main controls
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted main source
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git branch --show-current)" = main
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse --is-shallow-repository)" = false
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Authenticate to existing GCP deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Independently pin DEV in cloud control plane
        shell: bash
        run: |
          identity="$(gcloud compute instances describe "$GCP_INSTANCE" \
            --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
            --format='value(id,name,status)')"
          test "$identity" = "$GCP_INSTANCE_ID"$'\t'"$GCP_INSTANCE"$'\t'RUNNING

      - name: Reverify accepted Stage I without mutation
        shell: bash
        run: |
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --tunnel-through-iap \
            --command="sudo -n /usr/bin/python3 -B - preflight" \
            < scripts/memory_broker_stage2_control.py

      - name: Create one fresh Stage-II owner authorization
        shell: bash
        run: |
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --tunnel-through-iap \
            --command="sudo -n /usr/bin/python3 -B - authorize" \
            < scripts/memory_broker_stage2_control.py

      - name: Execute only the owner-authorized DEV runtime harness
        id: activation
        shell: bash
        run: |
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --tunnel-through-iap \
            --command="sudo -n /usr/bin/python3 -B - execute" \
            < scripts/memory_broker_stage2_control.py

      - name: Read-only PROD darkness audit
        shell: bash
        run: |
          gcloud compute ssh lilith-01 --quiet \
            --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --tunnel-through-iap \
            --command="sudo -n -u lilith /usr/bin/python3 -B -" \
            < scripts/audit_core_api_production_read_only.py

      - name: Stop on any post-authorization failure and preserve evidence
        if: ${{ failure() && steps.activation.outcome != 'skipped' }}
        shell: bash
        run: |
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --tunnel-through-iap \
            --command="sudo -n /usr/bin/python3 -B - failure-stop" \
            < scripts/memory_broker_stage2_control.py
