name: Deploy LILITH Core API to DEV

on:
  workflow_run:
    workflows:
      - Repository validation
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Exact open broker-candidate PR number'
        required: true
        type: string
      candidate_sha:
        description: 'Exact current 40-character PR head SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lilith-core-api-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Evaluate validated protected main for DEV
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      statuses: write
    env:
      GCP_PROJECT_ID: lilith-agent-260823-27389
      GCP_ZONE: asia-southeast1-b
      GCP_INSTANCE: lilith-dev-01
      GCP_PROD_INSTANCE: lilith-01
      GCP_PROD_INSTANCE_ID: "1332996232081478576"
      GCP_WIF_PROVIDER: projects/763184673487/locations/global/workloadIdentityPools/github-actions/providers/github
      GCP_DEPLOY_SA: github-lilith-deployer@lilith-agent-260823-27389.iam.gserviceaccount.com
      HEALTH_URL: http://127.0.0.1:8765/health
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      candidate_sha: ${{ steps.classify.outputs.candidate_sha }}

    steps:
      - name: Publish pending DEV deployment status
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'pending',
              context: 'LILITH DEV deployment',
              description: 'Validating trusted DEV gate for CI-validated commit',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Check out trusted deployment controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the exact commit validated by CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked-out revision
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git -C candidate rev-parse HEAD)" = "${VALIDATED_SHA}"

      - name: Resolve exact protected-main candidate and first parent
        id: main-revisions
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${VALIDATED_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${VALIDATED_SHA}"
          BASE_SHA="$(git -C candidate rev-parse HEAD^)"
          test "$(git rev-parse "${BASE_SHA}^{commit}")" = "${BASE_SHA}"
          echo "base_sha=${BASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "candidate_sha=${VALIDATED_SHA}" >> "${GITHUB_OUTPUT}"
          git checkout --detach "${BASE_SHA}"

      - name: Classify complete effective diff using validated protected-main candidate control
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ steps.main-revisions.outputs.base_sha }}
          CANDIDATE_SHA: ${{ steps.main-revisions.outputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git -C candidate fetch --no-tags origin "${BASE_SHA}"
          python candidate/scripts/classify_dev_deployment.py \
            --candidate-root candidate --base-sha "${BASE_SHA}" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Validate control-only candidate on the ephemeral runner
        if: steps.classify.outputs.mode == 'CONTROL_ONLY_NO_DEPLOY'
        shell: bash
        env:
          BASE_SHA: ${{ steps.classify.outputs.base_sha }}
          CANDIDATE_SHA: ${{ steps.classify.outputs.candidate_sha }}
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          cd candidate
          python scripts/validate_repository.py
          python -m compileall -q scripts/memory_broker_stage2_control.py scripts/memory_broker_os_installer.py
          python -m unittest scripts/test_memory_broker_os_controls.py scripts/test_memory_broker_stage2_control.py
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            .github/workflows/ci.yml .github/workflows/memory-broker-dev-stage2-runtime.yml
          bash -n scripts/run_memory_broker_dev_validation.sh
          {
            echo 'MODE=CONTROL_ONLY_NO_DEPLOY'
            echo 'DEV_MUTATION=NONE'
            echo "BASE_SHA=${BASE_SHA}"
            echo "CANDIDATE_SHA=${CANDIDATE_SHA}"
            echo 'Validation: repository contracts, dedicated Linux Stage-II and installer tests, workflow syntax, Python compilation, shell syntax.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build deterministic exact-SHA Core API bundle
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p deployment-output
          python scripts/build_core_api_bundle.py \
            --source-root candidate \
            --archive deployment-output/lilith-core-api.tar.gz \
            --attestation deployment-output/lilith-core-api.attestation.json \
            --candidate-sha "${VALIDATED_SHA}"

      - name: Detect broker component from exact candidate SHA
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        run: |
          BROKER_PRESENT="$(python scripts/memory_broker_validation.py detect --source-root candidate)"
          echo "BROKER_PRESENT=${BROKER_PRESENT}" >> "${GITHUB_ENV}"
          if test -f candidate/services/memory-broker/lilith_memory_broker/dev_core.py; then
            echo "BROKER_PERSISTENT_CANDIDATE=true" >> "${GITHUB_ENV}"
          fi

      - name: Build separate exact-SHA broker validation artifact
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED' && env.BROKER_PRESENT == 'PRESENT'
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python scripts/memory_broker_validation.py build \
            --source-root candidate \
            --archive deployment-output/lilith-memory-broker-validation.tar.gz \
            --attestation deployment-output/lilith-memory-broker-validation.attestation.json \
            --candidate-sha "${VALIDATED_SHA}"

      - name: Set up pinned Python for inert broker release validation
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED' && env.BROKER_PERSISTENT_CANDIDATE == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and verify inert exact-SHA synthetic broker release
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED' && env.BROKER_PERSISTENT_CANDIDATE == 'true'
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p deployment-output/broker-wheels
          python -m pip download --disable-pip-version-check --no-deps \
            --only-binary=:all: --platform manylinux2014_x86_64 \
            --python-version 3.12 --implementation cp --abi cp312 \
            --dest deployment-output/broker-wheels \
            cffi==2.1.1 cryptography==50.0.1 fido2==2.2.1 \
            pycparser==3.0 rfc8785==0.1.4
          python scripts/memory_broker_os_release.py build \
            --source-root candidate \
            --wheelhouse deployment-output/broker-wheels \
            --candidate-sha "${VALIDATED_SHA}" \
            --archive deployment-output/lilith-broker-inert-release.tar.gz \
            --attestation deployment-output/lilith-broker-inert-release.attestation.json
          python scripts/memory_broker_os_release.py verify \
            --candidate-sha "${VALIDATED_SHA}" \
            --archive deployment-output/lilith-broker-inert-release.tar.gz \
            --attestation deployment-output/lilith-broker-inert-release.attestation.json

      - name: Authenticate to Google Cloud
        if: >-
          steps.classify.outputs.mode == 'DEPLOY_REQUIRED' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}

      - name: Set up Google Cloud CLI
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify DEV deployment identity and target
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        run: |
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          gcloud compute instances describe "${GCP_INSTANCE}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --format="value(name,status)"

      - name: Upload DEV bootstrap and exact-SHA bundle through IAP
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        env:
          REMOTE_BUNDLE: /tmp/lilith-dev-bundle-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
          REMOTE_ATTESTATION: /tmp/lilith-dev-attestation-${{ github.run_id }}-${{ github.run_attempt }}.json
          REMOTE_BOOTSTRAP: /tmp/lilith-dev-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}.sh
          REMOTE_DEPLOY: /tmp/lilith-dev-deploy-${{ github.run_id }}-${{ github.run_attempt }}.sh
          REMOTE_VERIFIER: /tmp/lilith-dev-verify-${{ github.run_id }}-${{ github.run_attempt }}.py
          REMOTE_DURABILITY_PROBE: /tmp/lilith-dev-durability-${{ github.run_id }}-${{ github.run_attempt }}.py
        run: |
          gcloud compute scp --quiet \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            deployment-output/lilith-core-api.tar.gz \
            "${GCP_INSTANCE}:${REMOTE_BUNDLE}"
          gcloud compute scp --quiet \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            deployment-output/lilith-core-api.attestation.json \
            "${GCP_INSTANCE}:${REMOTE_ATTESTATION}"
          gcloud compute scp --quiet \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            scripts/bootstrap_core_api_dev.sh \
            "${GCP_INSTANCE}:${REMOTE_BOOTSTRAP}"
          gcloud compute scp --quiet \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            scripts/deploy_core_api_dev_remote.sh \
            "${GCP_INSTANCE}:${REMOTE_DEPLOY}"
          gcloud compute scp --quiet \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            scripts/verify_core_api_bundle.py \
            "${GCP_INSTANCE}:${REMOTE_VERIFIER}"
          gcloud compute scp --quiet \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            scripts/run_core_api_dev_durability_probe.py \
            "${GCP_INSTANCE}:${REMOTE_DURABILITY_PROBE}"

      - name: Bootstrap and deploy the isolated DEV service
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          REMOTE_BUNDLE: /tmp/lilith-dev-bundle-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
          REMOTE_ATTESTATION: /tmp/lilith-dev-attestation-${{ github.run_id }}-${{ github.run_attempt }}.json
          REMOTE_BOOTSTRAP: /tmp/lilith-dev-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}.sh
          REMOTE_DEPLOY: /tmp/lilith-dev-deploy-${{ github.run_id }}-${{ github.run_attempt }}.sh
          REMOTE_VERIFIER: /tmp/lilith-dev-verify-${{ github.run_id }}-${{ github.run_attempt }}.py
          REMOTE_DURABILITY_PROBE: /tmp/lilith-dev-durability-${{ github.run_id }}-${{ github.run_attempt }}.py
        run: |
          gcloud compute ssh "${GCP_INSTANCE}" --quiet \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --command="set -e; trap 'rm -f ${REMOTE_BUNDLE} ${REMOTE_ATTESTATION} ${REMOTE_BOOTSTRAP} ${REMOTE_DEPLOY} ${REMOTE_VERIFIER} ${REMOTE_DURABILITY_PROBE}' EXIT; sudo bash '${REMOTE_BOOTSTRAP}'; sudo bash '${REMOTE_DEPLOY}' '${REMOTE_BUNDLE}' '${REMOTE_ATTESTATION}' '${VALIDATED_SHA}' '${REMOTE_VERIFIER}' '${REMOTE_DURABILITY_PROBE}'"

      - name: Verify DEV service health
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gcloud compute ssh "${GCP_INSTANCE}" --quiet \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --command="sudo systemctl is-active lilith-os-api-dev.service && curl -fsS '${HEALTH_URL}' && echo && test \"\$(sudo -u lilith python3 -c 'import json; print(json.load(open(\"/home/lilith/.hermes/lilith-os-dev/current/deployment-manifest.json\"))[\"candidateSha\"])')\" = '${VALIDATED_SHA}' && sudo -u lilith cat /home/lilith/.hermes/lilith-os-dev/current/.bundle-sha256"

      - name: Upload separate broker validation artifact through IAP
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED' && env.BROKER_PRESENT == 'PRESENT'
        shell: bash
        env:
          REMOTE_BROKER_DIR: /tmp/lilith-broker-validation-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gcloud compute ssh "${GCP_INSTANCE}" --quiet \
            --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" --tunnel-through-iap \
            --command="umask 077; mkdir -m 700 '${REMOTE_BROKER_DIR}'"
          gcloud compute scp --quiet --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" --tunnel-through-iap \
            deployment-output/lilith-memory-broker-validation.tar.gz "${GCP_INSTANCE}:${REMOTE_BROKER_DIR}/archive.tar.gz"
          gcloud compute scp --quiet --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" --tunnel-through-iap \
            deployment-output/lilith-memory-broker-validation.attestation.json "${GCP_INSTANCE}:${REMOTE_BROKER_DIR}/attestation.json"
          gcloud compute scp --quiet --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" --tunnel-through-iap \
            scripts/memory_broker_validation.py "${GCP_INSTANCE}:${REMOTE_BROKER_DIR}/validator.py"
          gcloud compute scp --quiet --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" --tunnel-through-iap \
            scripts/run_memory_broker_dev_validation.sh "${GCP_INSTANCE}:${REMOTE_BROKER_DIR}/runner.sh"
          gcloud compute scp --quiet --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" --tunnel-through-iap \
            scripts/verify_broker_dev_lifecycle.py "${GCP_INSTANCE}:${REMOTE_BROKER_DIR}/lifecycle.py"

      - name: Validate broker transiently on DEV and prove no operational state
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED' && env.BROKER_PRESENT == 'PRESENT'
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          REMOTE_BROKER_DIR: /tmp/lilith-broker-validation-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gcloud compute ssh "${GCP_INSTANCE}" --quiet \
            --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" --tunnel-through-iap \
            --command="bash '${REMOTE_BROKER_DIR}/runner.sh' '${REMOTE_BROKER_DIR}/archive.tar.gz' '${REMOTE_BROKER_DIR}/attestation.json' '${VALIDATED_SHA}' '${REMOTE_BROKER_DIR}/validator.py' '/usr/bin/python3' '${REMOTE_BROKER_DIR}/lifecycle.py'"

      - name: Confirm broker validation upload cleanup
        if: always() && steps.classify.outputs.mode == 'DEPLOY_REQUIRED' && env.BROKER_PRESENT == 'PRESENT'
        shell: bash
        env:
          REMOTE_BROKER_DIR: /tmp/lilith-broker-validation-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gcloud compute ssh "${GCP_INSTANCE}" --quiet \
            --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" --tunnel-through-iap \
            --command="if test -d '${REMOTE_BROKER_DIR}'; then rm -f -- '${REMOTE_BROKER_DIR}/archive.tar.gz' '${REMOTE_BROKER_DIR}/attestation.json' '${REMOTE_BROKER_DIR}/validator.py' '${REMOTE_BROKER_DIR}/lifecycle.py' '${REMOTE_BROKER_DIR}/runner.sh'; rmdir -- '${REMOTE_BROKER_DIR}'; fi; test ! -e '${REMOTE_BROKER_DIR}'"

      - name: Audit production darkness on the pinned production VM
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        run: |
          test "${GCP_PROD_INSTANCE}" = "lilith-01"
          test "${GCP_PROD_INSTANCE}" != "${GCP_INSTANCE}"
          test "$(gcloud compute instances describe "${GCP_PROD_INSTANCE}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --format='value(id)')" = "${GCP_PROD_INSTANCE_ID}"
          AUDIT_SOURCE="$(base64 -w0 scripts/audit_core_api_production_read_only.py)"
          gcloud compute ssh "${GCP_PROD_INSTANCE}" --quiet \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --command="cd /tmp && sudo -u lilith python3 -B -c 'import base64,sys;exec(base64.b64decode(sys.argv[1]))' '${AUDIT_SOURCE}'"

      - name: Publish successful DEV deployment status
        if: ${{ success() && steps.classify.outputs.mode != 'BROKER_CANDIDATE_VALIDATE_ONLY' }}
        uses: actions/github-script@v8
        with:
          script: |
            const mode = '${{ steps.classify.outputs.mode }}';
            if (!['DEPLOY_REQUIRED', 'CONTROL_ONLY_NO_DEPLOY'].includes(mode)) {
              throw new Error('No trusted classification completed');
            }
            const description = mode === 'CONTROL_ONLY_NO_DEPLOY'
              ? 'MODE=CONTROL_ONLY_NO_DEPLOY DEV_MUTATION=NONE'
              : 'MODE=DEPLOY_REQUIRED DEV deployment and health passed';
            await core.summary.addRaw(`MODE=${mode}\nDEV_MUTATION=${mode === 'CONTROL_ONLY_NO_DEPLOY' ? 'NONE' : 'TRUSTED_DEPLOY'}\nBASE_SHA=${{ steps.classify.outputs.base_sha }}\nCANDIDATE_SHA=${{ steps.classify.outputs.candidate_sha }}\n`).write();
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'success',
              context: 'LILITH DEV deployment',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish failed DEV deployment status
        if: ${{ failure() }}
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'failure',
              context: 'LILITH DEV deployment',
              description: 'Trusted DEV gate, validation, or health failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  premerge_gate:
    name: Verify exact open PR and source checks before manual DEV observation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      base_sha: ${{ steps.identity.outputs.base_sha }}
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Reject non-main or unapproved manual inputs
        shell: bash
        env:
          REQUESTED_PR: ${{ inputs.pr_number }}
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$GITHUB_REPOSITORY" = rpahasara/lilith-os
          test "$GITHUB_REF" = refs/heads/main
          test "$REQUESTED_PR" = 38
          test "$REQUESTED_SHA" = 379fe8bba45cc0a2ebc79d9aa4c266eb5ffcdc3b
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out trusted protected-main controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify live PR identity and ruleset-required checks
        id: identity
        uses: actions/github-script@v8
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const candidate = process.env.REQUESTED_SHA;
            const branch = (await github.rest.repos.getBranch({owner, repo, branch: 'main'})).data;
            if (context.ref !== 'refs/heads/main' || branch.commit.sha !== context.sha)
              throw new Error('TRUSTED_MAIN_SHA_CHANGED');
            const pr = (await github.rest.pulls.get({owner, repo, pull_number: 38})).data;
            if (pr.state !== 'open' || pr.base.ref !== 'main' ||
                pr.base.repo.full_name !== 'rpahasara/lilith-os' ||
                pr.head.repo.full_name !== 'rpahasara/lilith-os' || pr.head.sha !== candidate)
              throw new Error('FROZEN_PR_IDENTITY_CHANGED');
            const commit = (await github.rest.repos.getCommit({owner, repo, ref: candidate})).data;
            if (commit.sha !== candidate) throw new Error('CANDIDATE_COMMIT_MISSING');
            const ruleset = (await github.request('GET /repos/{owner}/{repo}/rulesets/{ruleset_id}',
              {owner, repo, ruleset_id: 23205011})).data;
            if (ruleset.enforcement !== 'active')
              throw new Error('PROTECTED_RULESET_NOT_ACTIVE');
            const rules = ruleset.rules.filter(rule => rule.type === 'required_status_checks');
            if (rules.length !== 1) throw new Error('REQUIRED_CHECK_RULE_MISSING');
            const required = rules[0].parameters.required_status_checks;
            if (!Array.isArray(required) || required.length === 0)
              throw new Error('REQUIRED_CHECKS_EMPTY');
            const checkResult = (await github.rest.checks.listForRef(
              {owner, repo, ref: candidate, filter: 'latest', per_page: 100})).data;
            if (checkResult.total_count > 100) throw new Error('REQUIRED_CHECK_LIST_TOO_LARGE');
            const runs = checkResult.check_runs;
            for (const check of required) {
              const matches = runs.filter(run => run.name === check.context &&
                run.app?.id === check.integration_id && run.head_sha === candidate);
              if (matches.length !== 1 || matches[0].status !== 'completed' ||
                  matches[0].conclusion !== 'success')
                throw new Error(`REQUIRED_SOURCE_CHECK_NOT_GREEN:${check.context}`);
            }
            core.setOutput('base_sha', context.sha);
            core.setOutput('candidate_sha', candidate);
            core.summary.addRaw(`PR #38 head ${candidate}; ${required.length} ruleset-required checks green.\n`);
            await core.summary.write();
      - name: Verify protected-main checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Check out candidate as inert SHA-pinned data
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.identity.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Classify exact PR diff using trusted main control
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          CANDIDATE_SHA: ${{ steps.identity.outputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          python scripts/classify_dev_deployment.py \
            --candidate-root candidate --base-sha "$BASE_SHA" \
            --candidate-sha "$CANDIDATE_SHA" --github-output "$GITHUB_OUTPUT"
          test "$(sed -n 's/^mode=//p' "$GITHUB_OUTPUT")" = BROKER_CANDIDATE_VALIDATE_ONLY

  broker_preflight:
    name: Read-only accepted DEV preflight for broker candidate
    needs: [deploy, premerge_gate]
    if: >-
      always() && (
        (needs.deploy.outputs.mode == 'BROKER_CANDIDATE_VALIDATE_ONLY' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
         needs.premerge_gate.result == 'success' &&
         needs.premerge_gate.outputs.mode == 'BROKER_CANDIDATE_VALIDATE_ONLY'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      checks: read
    env:
      GCP_PROJECT_ID: lilith-agent-260823-27389
      GCP_ZONE: asia-southeast1-b
      GCP_INSTANCE: lilith-dev-01
      GCP_WIF_PROVIDER: projects/763184673487/locations/global/workloadIdentityPools/github-actions/providers/github
      GCP_DEPLOY_SA: github-lilith-deployer@lilith-agent-260823-27389.iam.gserviceaccount.com
    outputs:
      snapshot_sha: ${{ steps.snapshot.outputs.snapshot_sha }}
    steps:
      - name: Check out protected-main controls
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy.outputs.base_sha || needs.premerge_gate.outputs.base_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck frozen PR head immediately before manual PRE
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v8
        env:
          CANDIDATE_SHA: ${{ needs.premerge_gate.outputs.candidate_sha }}
          TRUSTED_MAIN_SHA: ${{ needs.premerge_gate.outputs.base_sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const branch = (await github.rest.repos.getBranch({owner, repo, branch: 'main'})).data;
            const pr = (await github.rest.pulls.get({owner, repo, pull_number: 38})).data;
            if (branch.commit.sha !== process.env.TRUSTED_MAIN_SHA ||
                pr.state !== 'open' || pr.head.sha !== process.env.CANDIDATE_SHA)
              throw new Error('FROZEN_PR_CHANGED_BEFORE_PRE');
            const ruleset = (await github.request('GET /repos/{owner}/{repo}/rulesets/{ruleset_id}',
              {owner, repo, ruleset_id: 23205011})).data;
            const required = ruleset.rules.find(rule => rule.type === 'required_status_checks')
              ?.parameters?.required_status_checks;
            if (ruleset.enforcement !== 'active' || !Array.isArray(required) || required.length === 0)
              throw new Error('REQUIRED_CHECK_RULE_CHANGED_BEFORE_PRE');
            const checkResult = (await github.rest.checks.listForRef({
              owner, repo, ref: process.env.CANDIDATE_SHA, filter: 'latest', per_page: 100
            })).data;
            if (checkResult.total_count > 100) throw new Error('REQUIRED_CHECK_LIST_TOO_LARGE');
            for (const check of required) {
              const matches = checkResult.check_runs.filter(run => run.name === check.context &&
                run.app?.id === check.integration_id && run.head_sha === process.env.CANDIDATE_SHA);
              if (matches.length !== 1 || matches[0].status !== 'completed' ||
                  matches[0].conclusion !== 'success')
                throw new Error(`REQUIRED_SOURCE_CHECK_NOT_GREEN:${check.context}`);
            }
      - name: Authenticate for read-only DEV observation
        if: >-
          (github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
           needs.premerge_gate.result == 'success')
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Record installed snapshot invocation tool versions
        shell: bash
        run: |
          gcloud version
          ssh -V
          python --version
          uname -srm
          . /etc/os-release
          printf 'runner_os=%s %s\n' "$ID" "$VERSION_ID"
      - name: Capture accepted DEV lifecycle without candidate code
        id: snapshot
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '${{ needs.deploy.outputs.base_sha || needs.premerge_gate.outputs.base_sha }}'
          python scripts/broker_candidate_dev_snapshot.py \
            --phase preflight > "${RUNNER_TEMP}/broker-preflight.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'broker-preflight.json').read_text())
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              if (result['toolReleaseId'] != 'c4d60b9c19debc9fcfece256641a9f83ca82b15b5343cd15cb81a1988c1c6261' or
                  result['acceptedBaselineDigest'] != 'abc33ebf8d43e8805f43ff11e663a4757bf558d9b62eda9669dabecbb7c9839a' or
                  result['snapshotSha256'] != 'dff5ccddad5884b57f5cf895a9c86c741077fd21857d6e67de57803e6fde68e5'):
                  raise SystemExit('FROZEN_PRE_SNAPSHOT_MISMATCH')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('snapshot_sha=' + result['snapshotSha256'] + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('BROKER_CANDIDATE_VALIDATE_ONLY accepted DEV preflight: ' + json.dumps(result, sort_keys=True) + '\n')
          PY

  broker_candidate:
    name: Isolated exact-SHA broker candidate validation
    needs: [deploy, premerge_gate, broker_preflight]
    if: >-
      always() && needs.broker_preflight.result == 'success' &&
      ((needs.deploy.outputs.mode == 'BROKER_CANDIDATE_VALIDATE_ONLY' &&
        github.event.workflow_run.event == 'push') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        needs.premerge_gate.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out protected-main validator
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy.outputs.base_sha || needs.premerge_gate.outputs.base_sha }}
          persist-credentials: false
      - name: Check out exact CI-validated broker candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy.outputs.candidate_sha || needs.premerge_gate.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert candidate has no DEV or cloud authority
        shell: bash
        run: |
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -z "${GCP_PROJECT_ID:-}"
          test -z "${GCP_DEPLOY_SA:-}"
          test ! -d "$HOME/.ssh" || test -z "$(find "$HOME/.ssh" -maxdepth 1 -type f -name 'id_*' -print -quit)"
          echo 'CANDIDATE_AUTH=NONE DEV_ENV=NONE SSH_KEY=NONE DEV_TRANSFER=NONE' >> "$GITHUB_STEP_SUMMARY"
      - name: Build and execute transient broker candidate without cloud credentials
        shell: bash
        env:
          BASE_SHA: ${{ needs.deploy.outputs.base_sha || needs.premerge_gate.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha || needs.premerge_gate.outputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${CANDIDATE_SHA}"
          mkdir -p deployment-output/broker-wheels
          python scripts/memory_broker_validation.py build \
            --source-root candidate \
            --archive deployment-output/broker-validation.tar.gz \
            --attestation deployment-output/broker-validation.attestation.json \
            --candidate-sha "${CANDIDATE_SHA}"
          python -m pip download --disable-pip-version-check --no-deps \
            --only-binary=:all: --platform manylinux2014_x86_64 \
            --python-version 3.12 --implementation cp --abi cp312 \
            --dest deployment-output/broker-wheels \
            cffi==2.1.1 cryptography==50.0.1 fido2==2.2.1 \
            pycparser==3.0 rfc8785==0.1.4
          python scripts/memory_broker_os_release.py build \
            --source-root candidate --wheelhouse deployment-output/broker-wheels \
            --candidate-sha "${CANDIDATE_SHA}" \
            --archive deployment-output/broker-release.tar.gz \
            --attestation deployment-output/broker-release.attestation.json
          python scripts/memory_broker_os_release.py verify \
            --candidate-sha "${CANDIDATE_SHA}" \
            --archive deployment-output/broker-release.tar.gz \
            --attestation deployment-output/broker-release.attestation.json
          python -m venv "${RUNNER_TEMP}/broker-venv"
          "${RUNNER_TEMP}/broker-venv/bin/python" -m pip install --disable-pip-version-check \
            --no-index --find-links deployment-output/broker-wheels fido2==2.2.1 rfc8785==0.1.4
          python scripts/memory_broker_validation.py verify-run \
            --archive deployment-output/broker-validation.tar.gz \
            --attestation deployment-output/broker-validation.attestation.json \
            --candidate-sha "${CANDIDATE_SHA}" \
            --python "${RUNNER_TEMP}/broker-venv/bin/python"
          python - <<'PY'
          import json, os, tarfile
          from pathlib import Path
          root = Path('deployment-output')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              for name in ('broker-validation.attestation.json', 'broker-release.attestation.json'):
                  summary.write(name + ': ' + json.dumps(json.loads((root / name).read_text()), sort_keys=True) + '\n')
              with tarfile.open(root / 'broker-release.tar.gz', 'r:gz') as archive:
                  member = archive.extractfile('release-manifest.json')
                  if member is None:
                      raise RuntimeError('RELEASE_MANIFEST_MISSING')
                  summary.write('release-manifest.json: ' + json.dumps(json.load(member), sort_keys=True) + '\n')
              summary.write('Candidate executed only on this credential-free hosted runner; no DEV upload or install.\n')
          PY

  broker_postflight:
    name: Read-only DEV postflight and required broker candidate status
    needs: [deploy, premerge_gate, broker_preflight, broker_candidate]
    if: >-
      always() && (
        (needs.deploy.outputs.mode == 'BROKER_CANDIDATE_VALIDATE_ONLY' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
         needs.premerge_gate.result == 'success' &&
         needs.broker_preflight.result == 'success' &&
         needs.broker_candidate.result != 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      statuses: write
    env:
      GCP_PROJECT_ID: lilith-agent-260823-27389
      GCP_ZONE: asia-southeast1-b
      GCP_INSTANCE: lilith-dev-01
      GCP_WIF_PROVIDER: projects/763184673487/locations/global/workloadIdentityPools/github-actions/providers/github
      GCP_DEPLOY_SA: github-lilith-deployer@lilith-agent-260823-27389.iam.gserviceaccount.com
    steps:
      - name: Check out protected-main controls
        if: >-
          needs.broker_preflight.result == 'success' &&
          (needs.broker_candidate.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && needs.broker_candidate.result == 'failure'))
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy.outputs.base_sha || needs.premerge_gate.outputs.base_sha }}
          persist-credentials: false
      - name: Set up Python
        if: >-
          needs.broker_preflight.result == 'success' &&
          (needs.broker_candidate.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && needs.broker_candidate.result == 'failure'))
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate for read-only DEV observation
        if: >-
          needs.broker_preflight.result == 'success' &&
          ((needs.broker_candidate.result == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
           (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
            needs.premerge_gate.result == 'success' && needs.broker_candidate.result != 'skipped'))
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}
      - name: Set up Google Cloud CLI
        if: >-
          needs.broker_preflight.result == 'success' &&
          (needs.broker_candidate.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && needs.broker_candidate.result == 'failure'))
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Record installed snapshot invocation tool versions
        if: >-
          needs.broker_preflight.result == 'success' &&
          (needs.broker_candidate.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && needs.broker_candidate.result == 'failure'))
        shell: bash
        run: |
          gcloud version
          ssh -V
          python --version
          uname -srm
          . /etc/os-release
          printf 'runner_os=%s %s\n' "$ID" "$VERSION_ID"
      - name: Prove complete accepted DEV snapshot equality
        id: equality
        if: >-
          needs.broker_preflight.result == 'success' &&
          (needs.broker_candidate.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && needs.broker_candidate.result == 'failure'))
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '${{ needs.deploy.outputs.base_sha || needs.premerge_gate.outputs.base_sha }}'
          python scripts/broker_candidate_dev_snapshot.py \
            --phase postflight \
            --expected-snapshot-sha '${{ needs.broker_preflight.outputs.snapshot_sha }}' \
            >> "${GITHUB_STEP_SUMMARY}"
      - name: Audit pinned production darkness without mutation
        id: prod_audit
        if: steps.equality.outcome == 'success' && github.event_name == 'workflow_run'
        shell: bash
        env:
          GCP_PROD_INSTANCE: lilith-01
          GCP_PROD_INSTANCE_ID: "1332996232081478576"
        run: |
          test "${GCP_PROD_INSTANCE}" = 'lilith-01'
          test "${GCP_PROD_INSTANCE}" != "${GCP_INSTANCE}"
          test "$(gcloud compute instances describe "${GCP_PROD_INSTANCE}" \
            --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" \
            --format='value(id)')" = "${GCP_PROD_INSTANCE_ID}"
          AUDIT_SOURCE="$(base64 -w0 scripts/audit_core_api_production_read_only.py)"
          gcloud compute ssh "${GCP_PROD_INSTANCE}" --quiet \
            --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --command="cd /tmp && sudo -u lilith python3 -B -c 'import base64,sys;exec(base64.b64decode(sys.argv[1]))' '${AUDIT_SOURCE}'"
      - name: Publish same required DEV deployment status
        if: always() && github.event_name == 'workflow_run'
        uses: actions/github-script@v8
        env:
          PREFLIGHT_RESULT: ${{ needs.broker_preflight.result }}
          CANDIDATE_RESULT: ${{ needs.broker_candidate.result }}
          EQUALITY_OUTCOME: ${{ steps.equality.outcome }}
          PROD_OUTCOME: ${{ steps.prod_audit.outcome }}
          CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha }}
        with:
          script: |
            const passed = process.env.PREFLIGHT_RESULT === 'success' &&
              process.env.CANDIDATE_RESULT === 'success' &&
              process.env.EQUALITY_OUTCOME === 'success' &&
              process.env.PROD_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: passed ? 'success' : 'failure',
              context: 'LILITH DEV deployment',
              description: passed ? 'BROKER_CANDIDATE_VALIDATE_ONLY: accepted DEV unchanged' :
                'Broker candidate validation or accepted DEV equality failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!passed) core.setFailed('Broker-only DEV validation did not pass');
      - name: Recheck frozen PR head after manual candidate attempt
        if: always() && github.event_name == 'workflow_dispatch' && needs.broker_preflight.result == 'success'
        uses: actions/github-script@v8
        env:
          CANDIDATE_SHA: ${{ needs.premerge_gate.outputs.candidate_sha }}
        with:
          script: |
            const pr = (await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: 38
            })).data;
            if (pr.state !== 'open' || pr.head.sha !== process.env.CANDIDATE_SHA)
              throw new Error('FROZEN_PR_CHANGED_DURING_VALIDATION');
      - name: Require manual candidate success and exact DEV equality
        if: always() && github.event_name == 'workflow_dispatch' && needs.broker_preflight.result == 'success'
        shell: bash
        run: |
          test '${{ needs.broker_candidate.result }}' = success
          test '${{ steps.equality.outcome }}' = success
          echo 'PREMERGE_CANDIDATE_VALIDATED=PASS DEV_MUTATION=NONE' >> "$GITHUB_STEP_SUMMARY"
