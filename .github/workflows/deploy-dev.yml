name: Deploy LILITH Core API to DEV

on:
  workflow_run:
    workflows:
      - Repository validation
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Exact open broker-candidate PR number'
        required: true
        type: string
      candidate_sha:
        description: 'Exact current 40-character PR head SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lilith-core-api-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Evaluate validated protected main for DEV
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      statuses: write
    env:
      GCP_PROJECT_ID: lilith-agent-260823-27389
      GCP_ZONE: asia-southeast1-b
      GCP_INSTANCE: lilith-dev-01
      GCP_WIF_PROVIDER: projects/763184673487/locations/global/workloadIdentityPools/github-actions/providers/github
      # 15B2b-B1c: DEV-only non-admin OS Login identity, federated only for this
      # exact workflow file on protected main. It has no PROD binding and no root.
      GCP_DEPLOY_SA: github-lilith-dev-deployer@lilith-agent-260823-27389.iam.gserviceaccount.com
      GCP_LEGACY_PRIVILEGED_SA: github-lilith-deployer@lilith-agent-260823-27389.iam.gserviceaccount.com
      HEALTH_URL: http://127.0.0.1:8765/health
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      candidate_sha: ${{ steps.classify.outputs.candidate_sha }}

    steps:
      - name: Publish pending DEV deployment status
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'pending',
              context: 'LILITH DEV deployment',
              description: 'Validating trusted DEV gate for CI-validated commit',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Check out trusted deployment controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the exact commit validated by CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked-out revision
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git -C candidate rev-parse HEAD)" = "${VALIDATED_SHA}"

      - name: Resolve exact protected-main candidate and first parent
        id: main-revisions
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${VALIDATED_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${VALIDATED_SHA}"
          BASE_SHA="$(git -C candidate rev-parse HEAD^)"
          test "$(git rev-parse "${BASE_SHA}^{commit}")" = "${BASE_SHA}"
          echo "base_sha=${BASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "candidate_sha=${VALIDATED_SHA}" >> "${GITHUB_OUTPUT}"
          git checkout --detach "${BASE_SHA}"

      - name: Classify complete effective diff using validated protected-main candidate control
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ steps.main-revisions.outputs.base_sha }}
          CANDIDATE_SHA: ${{ steps.main-revisions.outputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git -C candidate fetch --no-tags origin "${BASE_SHA}"
          python candidate/scripts/classify_dev_deployment.py \
            --candidate-root candidate --base-sha "${BASE_SHA}" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Validate control-only candidate on the ephemeral runner
        if: steps.classify.outputs.mode == 'CONTROL_ONLY_NO_DEPLOY'
        shell: bash
        env:
          BASE_SHA: ${{ steps.classify.outputs.base_sha }}
          CANDIDATE_SHA: ${{ steps.classify.outputs.candidate_sha }}
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          cd candidate
          python scripts/validate_repository.py
          python -m compileall -q scripts/memory_broker_stage2_control.py scripts/memory_broker_stage3_transition.py scripts/memory_broker_stage3_liveness.py scripts/memory_broker_stage3_guard_worker.py scripts/memory_broker_stage3_adapters.py scripts/memory_broker_stage3_final.py scripts/memory_broker_stage3_dispatch.py scripts/memory_broker_stage3_wiring_install.py scripts/memory_broker_stage3_dev_transport.py scripts/memory_broker_stage3_forensics.py scripts/memory_broker_os_installer.py
          python -m unittest scripts/test_memory_broker_os_controls.py scripts/test_memory_broker_stage2_control.py scripts/test_memory_broker_stage3_transition.py scripts/test_memory_broker_stage3_liveness.py scripts/test_memory_broker_stage3_guard_linux.py scripts/test_memory_broker_stage3_adapters.py scripts/test_memory_broker_stage3_final.py scripts/test_memory_broker_stage3_wiring.py scripts/test_memory_broker_stage3_dev_transport.py scripts/test_memory_broker_stage3_forensics.py
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            .github/workflows/ci.yml .github/workflows/memory-broker-dev-stage2-runtime.yml .github/workflows/memory-broker-dev-stage3-a2-final.yml .github/workflows/memory-broker-dev-stage3-a2-forensics.yml
          bash -n scripts/run_memory_broker_dev_validation.sh
          {
            echo 'MODE=CONTROL_ONLY_NO_DEPLOY'
            echo 'DEV_MUTATION=NONE'
            echo "BASE_SHA=${BASE_SHA}"
            echo "CANDIDATE_SHA=${CANDIDATE_SHA}"
            echo 'Validation: repository contracts, dedicated Linux Stage-II and installer tests, workflow syntax, Python compilation, shell syntax.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build deterministic exact-SHA Core API bundle
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p deployment-output
          python scripts/build_core_api_bundle.py \
            --source-root candidate \
            --archive deployment-output/lilith-core-api.tar.gz \
            --attestation deployment-output/lilith-core-api.attestation.json \
            --candidate-sha "${VALIDATED_SHA}"

      - name: Detect broker component from exact candidate SHA
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        run: |
          BROKER_PRESENT="$(python scripts/memory_broker_validation.py detect --source-root candidate)"
          echo "BROKER_PRESENT=${BROKER_PRESENT}" >> "${GITHUB_ENV}"
          if test -f candidate/services/memory-broker/lilith_memory_broker/dev_core.py; then
            echo "BROKER_PERSISTENT_CANDIDATE=true" >> "${GITHUB_ENV}"
          fi

      - name: Build separate exact-SHA broker validation artifact
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED' && env.BROKER_PRESENT == 'PRESENT'
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python scripts/memory_broker_validation.py build \
            --source-root candidate \
            --archive deployment-output/lilith-memory-broker-validation.tar.gz \
            --attestation deployment-output/lilith-memory-broker-validation.attestation.json \
            --candidate-sha "${VALIDATED_SHA}"

      - name: Validate broker candidate transiently before any cloud authentication
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED' && env.BROKER_PRESENT == 'PRESENT'
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          python -m venv "${RUNNER_TEMP}/broker-venv"
          "${RUNNER_TEMP}/broker-venv/bin/python" -m pip install --no-input --no-cache-dir \
            --disable-pip-version-check 'fido2==2.2.1' 'rfc8785==0.1.4'
          python scripts/memory_broker_validation.py verify-run \
            --archive deployment-output/lilith-memory-broker-validation.tar.gz \
            --attestation deployment-output/lilith-memory-broker-validation.attestation.json \
            --candidate-sha "${VALIDATED_SHA}" \
            --python "${RUNNER_TEMP}/broker-venv/bin/python"
          echo 'BROKER_VALIDATION=RUNNER_ONLY DEV_BROKER_REACH=NONE' >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up pinned Python for inert broker release validation
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED' && env.BROKER_PERSISTENT_CANDIDATE == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and verify inert exact-SHA synthetic broker release
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED' && env.BROKER_PERSISTENT_CANDIDATE == 'true'
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p deployment-output/broker-wheels
          python -m pip download --disable-pip-version-check --no-deps \
            --only-binary=:all: --platform manylinux2014_x86_64 \
            --python-version 3.12 --implementation cp --abi cp312 \
            --dest deployment-output/broker-wheels \
            cffi==2.1.1 cryptography==50.0.1 fido2==2.2.1 \
            pycparser==3.0 rfc8785==0.1.4
          python scripts/memory_broker_os_release.py build \
            --source-root candidate \
            --wheelhouse deployment-output/broker-wheels \
            --candidate-sha "${VALIDATED_SHA}" \
            --archive deployment-output/lilith-broker-inert-release.tar.gz \
            --attestation deployment-output/lilith-broker-inert-release.attestation.json
          python scripts/memory_broker_os_release.py verify \
            --candidate-sha "${VALIDATED_SHA}" \
            --archive deployment-output/lilith-broker-inert-release.tar.gz \
            --attestation deployment-output/lilith-broker-inert-release.attestation.json

      - name: Record GitHub OIDC claims presented to DEV federation
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        run: |
          set -euo pipefail
          oidc="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://iam.googleapis.com/${GCP_WIF_PROVIDER}" | jq -r .value)"
          echo "::add-mask::${oidc}"
          python3 -c 'import base64,json,sys; p=sys.argv[1].split(".")[1]; c=json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4))); print("OIDC_CLAIMS=" + json.dumps({k:c.get(k) for k in ("repository","ref","workflow_ref","job_workflow_ref","event_name")}, sort_keys=True))' "${oidc}" \
            | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Authenticate to Google Cloud
        if: >-
          steps.classify.outputs.mode == 'DEPLOY_REQUIRED' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}

      - name: Set up Google Cloud CLI
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify DEV deployment identity and target
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        run: |
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          gcloud compute instances describe "${GCP_INSTANCE}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --format="value(name,status)"

      # Runs BEFORE deployment: this first login materializes the OS Login
      # identity, and the deploy proceeds only if its effective privilege is
      # exactly the fixed helper.
      - name: Prove the routine DEV deployer has no root, broker, or Stage III reach
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        run: |
          gcloud compute ssh "${GCP_INSTANCE}" --quiet \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --ssh-key-expire-after=2h \
            --ssh-flag=-T \
            --command="bash -s" <<'REMOTE'
          set -u
          fail=0
          deny() { if "$@" >/dev/null 2>&1; then echo "ALLOWED(unexpected): $*"; fail=1; else echo "DENIED: $*"; fi; }
          id
          if ! . /usr/local/lib/lilith-dev-deploy/effective_sudo_proof.sh; then
            echo "SUDO_EFFECTIVE_PROOF=FAIL reason=PROOF_CONTROL_MISSING"
            exit 1
          fi
          lilith_dev_effective_sudo_proof sa_112096412008414111981 self || fail=1
          deny sudo -n true
          deny sudo -n bash -c true
          deny sudo -n /usr/bin/python3 -c 0
          deny sudo -n /usr/bin/systemctl restart lilith-memory-broker.service
          deny sudo -n -u lilith true
          for path in /opt/lilith-memory-broker /opt/lilith-memory-broker/current /etc/lilith-memory-broker \
              /etc/systemd/system /etc/systemd/system/lilith-memory-broker.service /etc/sudoers.d \
              /var/lib/lilith-memory-broker /etc/lilith-os-dev /etc/lilith-os-dev/canonical-runtime.json \
              /usr/local/sbin/lilith-dev-deploy /usr/local/lib/lilith-dev-deploy; do
            deny test -w "$path"
          done
          for path in /etc/lilith-memory-broker/identities.json /etc/lilith-memory-broker/dev.json \
              /etc/lilith-memory-broker/b1b2b-stage3-a2-authorization.json /var/lib/lilith-memory-broker \
              /var/lib/.lilith-memory-broker-stage3-a2 /run/lilith-memory/owner.sock /home/lilith; do
            deny test -r "$path"
          done
          deny test -x /run/lilith-memory
          for path in /etc/lilith-os-dev/activation /etc/lilith-os-dev/activation/grant.json \
              /etc/lilith-os-dev/activation/allowed-signers /usr/local/sbin/lilith-activation-verify; do
            deny test -w "$path"
          done
          activation="$(/usr/local/sbin/lilith-activation-verify)" || true
          echo "$activation"
          case "$activation" in
            "ACTIVATION=NOT_ACCEPTED reason=GRANT_ABSENT "*) ;;
            *) echo "UNEXPECTED ACCEPTED-ACTIVATION STATE"; fail=1 ;;
          esac
          exit "$fail"
          REMOTE

      - name: Package exact-SHA bundle for the fixed DEV helper
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        run: |
          tar -C deployment-output -cf deployment-output/lilith-dev-payload.tar \
            lilith-core-api.tar.gz lilith-core-api.attestation.json
          sha256sum deployment-output/lilith-dev-payload.tar

      - name: Deploy through the fixed root-owned DEV helper
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "${VALIDATED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          gcloud compute ssh "${GCP_INSTANCE}" --quiet \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --ssh-flag=-T \
            --command="sudo -n /usr/local/sbin/lilith-dev-deploy deploy ${VALIDATED_SHA}" \
            < deployment-output/lilith-dev-payload.tar

      - name: Verify DEV service health
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gcloud compute ssh "${GCP_INSTANCE}" --quiet \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --ssh-flag=-T \
            --command="systemctl is-active lilith-os-api-dev.service && curl -fsS '${HEALTH_URL}' && echo && sudo -n /usr/local/sbin/lilith-dev-deploy status" \
            < /dev/null | tee "${RUNNER_TEMP}/dev-status.txt"
          grep -qxF "candidateSha=${VALIDATED_SHA}" "${RUNNER_TEMP}/dev-status.txt"

      - name: Prove routine DEV federation cannot obtain PROD or the legacy privileged identity
        if: steps.classify.outputs.mode == 'DEPLOY_REQUIRED'
        shell: bash
        run: |
          set -euo pipefail
          oidc="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://iam.googleapis.com/${GCP_WIF_PROVIDER}" | jq -r .value)"
          echo "::add-mask::${oidc}"
          python3 -c 'import base64,json,sys; p=sys.argv[1].split(".")[1]; c=json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4))); print(json.dumps({k:c.get(k) for k in ("repository","ref","workflow_ref","event_name")}))' "${oidc}"
          federated="$(jq -n --arg t "${oidc}" --arg a "//iam.googleapis.com/${GCP_WIF_PROVIDER}" \
            '{grantType:"urn:ietf:params:oauth:grant-type:token-exchange",audience:$a,scope:"https://www.googleapis.com/auth/cloud-platform",requestedTokenType:"urn:ietf:params:oauth:token-type:access_token",subjectTokenType:"urn:ietf:params:oauth:token-type:jwt",subjectToken:$t}' \
            | curl -sSf https://sts.googleapis.com/v1/token -H 'Content-Type: application/json' -d @- | jq -r .access_token)"
          echo "::add-mask::${federated}"
          # Each call records the HTTP status explicitly (no curl -f): an expected
          # 403 is denial evidence, a transport error is its own failure, and no
          # token or response body is ever printed.
          resp="$(mktemp)"
          trap 'rm -f "${resp}"' EXIT
          fail=0
          call() {  # call <bearer> <url> <json>; sets code (HTTP status or TRANSPORT)
            if ! code="$(curl -sS -o "${resp}" -w '%{http_code}' -X POST -H "Authorization: Bearer $1" \
                -H 'Content-Type: application/json' -d "$3" "$2")"; then
              code=TRANSPORT
            fi
          }
          verdict() {  # verdict <label> <kind>; kinds: mint-allowed, mint-denied, prod-denied
            if ! python3 - "$1" "$2" "${code}" "${resp}" <<'PY'
          import json, sys
          label, kind, code, path = sys.argv[1:]
          NON_AUTHZ = {"SERVICE_DISABLED", "API_DISABLED", "ACCESS_TOKEN_SCOPE_INSUFFICIENT",
                       "RATE_LIMIT_EXCEEDED", "RESOURCE_EXHAUSTED", "accessNotConfigured",
                       "rateLimitExceeded", "userRateLimitExceeded", "quotaExceeded"}
          def out(ok, why):
              print(f"{'PASS' if ok else 'FAIL'} {label} kind={kind} http={code} {why}")
              sys.exit(0 if ok else 1)
          if code == "TRANSPORT":
              out(False, "transport-failure")
          try:
              body = json.load(open(path, encoding="utf-8"))
          except Exception:
              out(False, "malformed-response")
          if not isinstance(body, dict):
              out(False, "malformed-response")
          def permission_denied():
              err = body.get("error")
              if not isinstance(err, dict) or err.get("code") != 403:
                  return False, "not-a-403-error-body"
              reasons = {d.get("reason") for d in err.get("details", []) if isinstance(d, dict)}
              reasons |= {e.get("reason") for e in err.get("errors", []) if isinstance(e, dict)}
              reasons.discard(None)
              if reasons & NON_AUTHZ:
                  return False, "non-authorization-403=" + ",".join(sorted(reasons & NON_AUTHZ))
              return True, f"permission-denied status={err.get('status', '-')} reasons={','.join(sorted(reasons)) or '-'}"
          if kind == "mint-allowed":
              token = body.get("accessToken")
              out(code == "200" and isinstance(token, str) and token != "",
                  "token-issued" if code == "200" else "expected-200")
          if kind == "mint-denied":
              if code != "403":
                  out(False, "expected-403" + (" LEGACY-IDENTITY-OBTAINED" if code == "200" else ""))
              out(*permission_denied())
          if kind == "prod-denied":
              if code == "200":
                  granted = body.get("permissions", [])
                  out(granted == [], "granted=" + json.dumps(granted))
              if code == "403":
                  out(*permission_denied())
              out(False, "unexpected-status")
          out(False, "unknown-kind")
          PY
            then
              fail=1
            fi
            : > "${resp}"
          }
          mint_body='{"scope":["https://www.googleapis.com/auth/cloud-platform"]}'
          call "${federated}" "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${GCP_DEPLOY_SA}:generateAccessToken" "${mint_body}"
          verdict DEV_IDENTITY_MINT mint-allowed
          call "${federated}" "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${GCP_LEGACY_PRIVILEGED_SA}:generateAccessToken" "${mint_body}"
          verdict LEGACY_PRIVILEGED_MINT mint-denied
          access="$(gcloud auth print-access-token)"
          echo "::add-mask::${access}"
          call "${access}" "https://compute.googleapis.com/compute/v1/projects/${GCP_PROJECT_ID}/zones/${GCP_ZONE}/instances/lilith-01/testIamPermissions" \
            '{"permissions":["compute.instances.osLogin","compute.instances.osAdminLogin","compute.instances.setMetadata"]}'
          verdict PROD_COMPUTE prod-denied
          call "${access}" "https://iap.googleapis.com/v1/projects/763184673487/iap_tunnel/zones/${GCP_ZONE}/instances/lilith-01:testIamPermissions" \
            '{"permissions":["iap.tunnelInstances.accessViaIAP"]}'
          verdict PROD_IAP prod-denied
          call "${access}" "https://iam.googleapis.com/v1/projects/${GCP_PROJECT_ID}/serviceAccounts/lilith-vm@${GCP_PROJECT_ID}.iam.gserviceaccount.com:testIamPermissions" \
            '{"permissions":["iam.serviceAccounts.actAs","iam.serviceAccounts.getAccessToken"]}'
          verdict PROD_SA prod-denied
          if [ "${fail}" != 0 ]; then
            echo "FEDERATION_BOUNDARY=FAIL"
            exit 1
          fi
          echo "FEDERATION_BOUNDARY=PASS"
          echo 'PROD_AUTHORITY=NONE LEGACY_PRIVILEGED_IDENTITY=UNOBTAINABLE' >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish successful DEV deployment status
        if: ${{ success() && steps.classify.outputs.mode != 'BROKER_CANDIDATE_VALIDATE_ONLY' }}
        uses: actions/github-script@v8
        with:
          script: |
            const mode = '${{ steps.classify.outputs.mode }}';
            if (!['DEPLOY_REQUIRED', 'CONTROL_ONLY_NO_DEPLOY'].includes(mode)) {
              throw new Error('No trusted classification completed');
            }
            const description = mode === 'CONTROL_ONLY_NO_DEPLOY'
              ? 'MODE=CONTROL_ONLY_NO_DEPLOY DEV_MUTATION=NONE'
              : 'MODE=DEPLOY_REQUIRED DEV deployment and health passed';
            await core.summary.addRaw(`MODE=${mode}\nDEV_MUTATION=${mode === 'CONTROL_ONLY_NO_DEPLOY' ? 'NONE' : 'TRUSTED_DEPLOY'}\nBASE_SHA=${{ steps.classify.outputs.base_sha }}\nCANDIDATE_SHA=${{ steps.classify.outputs.candidate_sha }}\n`).write();
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'success',
              context: 'LILITH DEV deployment',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish failed DEV deployment status
        if: ${{ failure() }}
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'failure',
              context: 'LILITH DEV deployment',
              description: 'Trusted DEV gate, validation, or health failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  premerge_gate:
    name: Verify exact open PR and source checks before manual DEV observation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      base_sha: ${{ steps.identity.outputs.base_sha }}
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Reject non-main or malformed manual inputs
        shell: bash
        env:
          REQUESTED_PR: ${{ inputs.pr_number }}
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$GITHUB_REPOSITORY" = rpahasara/lilith-os
          test "$GITHUB_REF" = refs/heads/main
          test "$REQUESTED_PR" = 38
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out trusted protected-main controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify live PR identity and ruleset-required checks
        id: identity
        uses: actions/github-script@v8
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const candidate = process.env.REQUESTED_SHA;
            const branch = (await github.rest.repos.getBranch({owner, repo, branch: 'main'})).data;
            if (context.ref !== 'refs/heads/main' || branch.commit.sha !== context.sha)
              throw new Error('TRUSTED_MAIN_SHA_CHANGED');
            const pr = (await github.rest.pulls.get({owner, repo, pull_number: 38})).data;
            if (pr.state !== 'open' || pr.base.ref !== 'main' ||
                pr.base.repo.full_name !== 'rpahasara/lilith-os' ||
                pr.head.repo.full_name !== 'rpahasara/lilith-os' || pr.head.sha !== candidate)
              throw new Error('FROZEN_PR_IDENTITY_CHANGED');
            const commit = (await github.rest.repos.getCommit({owner, repo, ref: candidate})).data;
            if (commit.sha !== candidate) throw new Error('CANDIDATE_COMMIT_MISSING');
            const ruleset = (await github.request('GET /repos/{owner}/{repo}/rulesets/{ruleset_id}',
              {owner, repo, ruleset_id: 23205011})).data;
            if (ruleset.enforcement !== 'active')
              throw new Error('PROTECTED_RULESET_NOT_ACTIVE');
            const rules = ruleset.rules.filter(rule => rule.type === 'required_status_checks');
            if (rules.length !== 1) throw new Error('REQUIRED_CHECK_RULE_MISSING');
            const required = rules[0].parameters.required_status_checks;
            if (!Array.isArray(required) || required.length === 0)
              throw new Error('REQUIRED_CHECKS_EMPTY');
            const checkResult = (await github.rest.checks.listForRef(
              {owner, repo, ref: candidate, filter: 'latest', per_page: 100})).data;
            if (checkResult.total_count > 100) throw new Error('REQUIRED_CHECK_LIST_TOO_LARGE');
            const runs = checkResult.check_runs;
            for (const check of required) {
              const matches = runs.filter(run => run.name === check.context &&
                run.app?.id === check.integration_id && run.head_sha === candidate);
              if (matches.length !== 1 || matches[0].status !== 'completed' ||
                  matches[0].conclusion !== 'success')
                throw new Error(`REQUIRED_SOURCE_CHECK_NOT_GREEN:${check.context}`);
            }
            core.setOutput('base_sha', context.sha);
            core.setOutput('candidate_sha', candidate);
            core.summary.addRaw(`PR #38 head ${candidate}; ${required.length} ruleset-required checks green.\n`);
            await core.summary.write();
      - name: Verify protected-main checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Check out candidate as inert SHA-pinned data
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.identity.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Classify exact PR diff using trusted main control
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          CANDIDATE_SHA: ${{ steps.identity.outputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C candidate merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          python scripts/classify_dev_deployment.py \
            --candidate-root candidate --base-sha "$BASE_SHA" \
            --candidate-sha "$CANDIDATE_SHA" --github-output "$GITHUB_OUTPUT"
          test "$(sed -n 's/^mode=//p' "$GITHUB_OUTPUT")" = BROKER_CANDIDATE_VALIDATE_ONLY

  broker_candidate:
    name: Isolated exact-SHA broker candidate validation
    needs: [deploy, premerge_gate]
    if: >-
      always() &&
      ((needs.deploy.outputs.mode == 'BROKER_CANDIDATE_VALIDATE_ONLY' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        needs.premerge_gate.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out protected-main validator
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy.outputs.base_sha || needs.premerge_gate.outputs.base_sha }}
          persist-credentials: false
      - name: Check out exact CI-validated broker candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy.outputs.candidate_sha || needs.premerge_gate.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert candidate has no DEV or cloud authority
        shell: bash
        run: |
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -z "${GCP_PROJECT_ID:-}"
          test -z "${GCP_DEPLOY_SA:-}"
          test ! -d "$HOME/.ssh" || test -z "$(find "$HOME/.ssh" -maxdepth 1 -type f -name 'id_*' -print -quit)"
          echo 'CANDIDATE_AUTH=NONE DEV_ENV=NONE SSH_KEY=NONE DEV_TRANSFER=NONE' >> "$GITHUB_STEP_SUMMARY"
      - name: Build and execute transient broker candidate without cloud credentials
        shell: bash
        env:
          BASE_SHA: ${{ needs.deploy.outputs.base_sha || needs.premerge_gate.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha || needs.premerge_gate.outputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${CANDIDATE_SHA}"
          mkdir -p deployment-output/broker-wheels
          python scripts/memory_broker_validation.py build \
            --source-root candidate \
            --archive deployment-output/broker-validation.tar.gz \
            --attestation deployment-output/broker-validation.attestation.json \
            --candidate-sha "${CANDIDATE_SHA}"
          python -m pip download --disable-pip-version-check --no-deps \
            --only-binary=:all: --platform manylinux2014_x86_64 \
            --python-version 3.12 --implementation cp --abi cp312 \
            --dest deployment-output/broker-wheels \
            cffi==2.1.1 cryptography==50.0.1 fido2==2.2.1 \
            pycparser==3.0 rfc8785==0.1.4
          python scripts/memory_broker_os_release.py build \
            --source-root candidate --wheelhouse deployment-output/broker-wheels \
            --candidate-sha "${CANDIDATE_SHA}" \
            --archive deployment-output/broker-release.tar.gz \
            --attestation deployment-output/broker-release.attestation.json
          python scripts/memory_broker_os_release.py verify \
            --candidate-sha "${CANDIDATE_SHA}" \
            --archive deployment-output/broker-release.tar.gz \
            --attestation deployment-output/broker-release.attestation.json
          python -m venv "${RUNNER_TEMP}/broker-venv"
          "${RUNNER_TEMP}/broker-venv/bin/python" -m pip install --disable-pip-version-check \
            --no-index --find-links deployment-output/broker-wheels fido2==2.2.1 rfc8785==0.1.4
          python scripts/memory_broker_validation.py verify-run \
            --archive deployment-output/broker-validation.tar.gz \
            --attestation deployment-output/broker-validation.attestation.json \
            --candidate-sha "${CANDIDATE_SHA}" \
            --python "${RUNNER_TEMP}/broker-venv/bin/python"
          python - <<'PY'
          import json, os, tarfile
          from pathlib import Path
          root = Path('deployment-output')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              for name in ('broker-validation.attestation.json', 'broker-release.attestation.json'):
                  summary.write(name + ': ' + json.dumps(json.loads((root / name).read_text()), sort_keys=True) + '\n')
              with tarfile.open(root / 'broker-release.tar.gz', 'r:gz') as archive:
                  member = archive.extractfile('release-manifest.json')
                  if member is None:
                      raise RuntimeError('RELEASE_MANIFEST_MISSING')
                  summary.write('release-manifest.json: ' + json.dumps(json.load(member), sort_keys=True) + '\n')
              summary.write('Candidate executed only on this credential-free hosted runner; no DEV upload or install.\n')
          PY

  broker_postflight:
    name: Required broker candidate status without DEV or PROD authority
    needs: [deploy, premerge_gate, broker_candidate]
    if: >-
      always() && (
        (needs.deploy.outputs.mode == 'BROKER_CANDIDATE_VALIDATE_ONLY' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
         needs.premerge_gate.result == 'success' &&
         needs.broker_candidate.result != 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # 15B2b-B1c: accepted-DEV broker snapshot equality needs root and is now
      # owner break-glass evidence only. Routine DEV automation cannot mutate
      # the broker, so it neither observes nor claims broker state here.
      - name: Publish same required DEV deployment status
        if: always() && github.event_name == 'workflow_run'
        uses: actions/github-script@v8
        env:
          CANDIDATE_RESULT: ${{ needs.broker_candidate.result }}
          CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha }}
        with:
          script: |
            const passed = process.env.CANDIDATE_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: passed ? 'success' : 'failure',
              context: 'LILITH DEV deployment',
              description: passed ? 'BROKER_CANDIDATE_VALIDATE_ONLY: runner-only validation; DEV untouched' :
                'Broker candidate validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!passed) core.setFailed('Broker-only DEV validation did not pass');
      - name: Recheck frozen PR head after manual candidate attempt
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v8
        env:
          CANDIDATE_SHA: ${{ needs.premerge_gate.outputs.candidate_sha }}
        with:
          script: |
            const pr = (await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: 38
            })).data;
            if (pr.state !== 'open' || pr.head.sha !== process.env.CANDIDATE_SHA)
              throw new Error('FROZEN_PR_CHANGED_DURING_VALIDATION');
      - name: Require manual candidate success
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          test '${{ needs.broker_candidate.result }}' = success
          echo 'PREMERGE_CANDIDATE_VALIDATED=PASS DEV_MUTATION=NONE DEV_AUTH=NONE' >> "$GITHUB_STEP_SUMMARY"
