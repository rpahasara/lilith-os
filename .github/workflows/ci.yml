name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject whitespace errors
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi

      - name: Validate repository contracts
        run: python scripts/validate_repository.py

  frontend-quality:
    name: Frontend build and command core
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependency security
        run: npm audit --audit-level=high

      - name: Build production frontend
        run: npm run build

      - name: Run Command Core self-test
        run: npm run test:core

  backend-quality:
    name: Core API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core-api/requirements.txt

      - name: Install Core API dependencies
        run: python -m pip install --disable-pip-version-check -r services/core-api/requirements.txt

      - name: Compile Core API
        run: python -m py_compile services/core-api/app.py

      - name: Run Core API tests
        run: python -m unittest discover -s services/core-api/tests -p "test_*.py"
