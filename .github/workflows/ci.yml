name: Repository validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Structure and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject whitespace errors
        run: git diff-tree --check --no-commit-id --root -r HEAD
      - name: Validate repository contracts
        run: python scripts/validate_repository.py

  product-quality-gates:
    name: Product quality gates (future)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Enable after the product stack and its test contracts are selected."
