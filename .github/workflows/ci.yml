name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject whitespace errors
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi

      - name: Validate repository contracts
        run: python scripts/validate_repository.py

      - name: Validate trusted DEV durability controls
        run: python -m unittest scripts/test_core_api_dev_durability_probe.py

      - name: Validate trusted memory broker artifact controls
        run: python -m unittest scripts/test_memory_broker_validation.py

      - name: Validate inert broker release and installer controls
        run: python -m unittest scripts/test_memory_broker_os_controls.py

      - name: Validate Stage-II control-only and Linux isolation harness contracts
        run: python -m unittest scripts/test_memory_broker_stage2_control.py

      - name: Validate dormant Stage-III reversible transition contracts
        run: python -m unittest scripts/test_memory_broker_stage3_transition.py scripts/test_memory_broker_stage3_liveness.py scripts/test_memory_broker_stage3_guard_linux.py scripts/test_memory_broker_stage3_adapters.py scripts/test_memory_broker_stage3_final.py scripts/test_memory_broker_stage3_wiring.py

      - name: Validate manual-only Stage-III DEV transport and dispatch contract
        run: python -m unittest scripts/test_memory_broker_stage3_dev_transport.py

      - name: Validate read-only consumed-run forensic inspection contract
        run: python -m unittest scripts/test_memory_broker_stage3_forensics.py

      - name: Validate protected-main DEV gate classification and bypass resistance
        run: python -m unittest scripts/test_classify_dev_deployment.py

      - name: Validate broker-only DEV gate and accepted-state equality contracts
        run: python -m unittest scripts/test_broker_candidate_dev_snapshot.py scripts/test_broker_only_dev_workflow.py

      - name: Validate PR source-only and protected-main DEV event boundaries
        run: python -m unittest scripts/test_pr_ci_dev_separation.py

      - name: Parse PR and DEV workflow YAML
        run: ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' .github/workflows/ci.yml .github/workflows/deploy-dev.yml .github/workflows/memory-broker-dev-stage3-a2-final.yml .github/workflows/memory-broker-dev-stage3-a2-forensics.yml

      - name: Validate fixed trusted snapshot source, release, and installer contracts
        run: python -m unittest scripts/test_trusted_broker_snapshot.py

      - name: Prove Linux trusted snapshot read/write confinement
        run: sudo -n /usr/bin/python3 -B -m unittest scripts/test_trusted_broker_snapshot_linux.py

      - name: Validate trusted broker lifecycle and production absence gates
        run: python -m unittest scripts/test_broker_dev_lifecycle.py

      - name: Check broker DEV validation shell syntax
        run: bash -n scripts/run_memory_broker_dev_validation.sh

      - name: Statically verify proposed broker systemd units when present
        shell: bash
        run: |
          if test -f services/memory-broker/deploy/lilith-memory-broker.service; then
            service=services/memory-broker/deploy/lilith-memory-broker.service
            grep -Fxq 'ExecStart=/opt/lilith-memory-broker/current/venv/bin/python -B -m lilith_memory_broker.server' "$service"
            test "$(grep -c '^ExecStart=' "$service")" -eq 1
            unit_dir="$(mktemp -d)"
            trap 'rm -rf -- "$unit_dir"' EXIT
            # The future /opt release is intentionally absent on CI. Verify
            # the unit syntax using an executable stand-in in a temporary copy.
            sed 's#^ExecStart=.*#ExecStart=/usr/bin/true#' "$service" > "$unit_dir/lilith-memory-broker.service"
            cp services/memory-broker/deploy/lilith-memory-broker.socket "$unit_dir/lilith-memory-broker.socket"
            systemd-analyze verify \
              "$unit_dir/lilith-memory-broker.service" \
              "$unit_dir/lilith-memory-broker.socket"
          fi

  frontend-quality:
    name: Frontend build and command core
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependency security
        run: npm audit --audit-level=high

      - name: Build production frontend
        run: npm run build

      - name: Run Command Core self-test
        run: npm run test:core

  backend-quality:
    name: Core API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core-api/requirements.txt

      - name: Install Core API dependencies
        run: python -m pip install --disable-pip-version-check -r services/core-api/requirements.txt

      - name: Compile Core API
        run: python -m compileall -q services/core-api/app.py services/core-api/lilith_memory

      - name: Run Core API tests
        run: python -m unittest discover -s services/core-api/tests -p "test_*.py"

      - name: Compile and test governed memory broker when present
        run: python scripts/memory_broker_validation.py ci --source-root .

      - name: Run Slice 8-15 architecture regressions
        run: python scripts/run_cognitive_regressions.py

  pr-source-required-check:
    # Preserve the existing required-check name without granting PRs DEV access.
    name: LILITH DEV deployment
    if: always() && github.event_name == 'pull_request'
    needs: [repository-contracts, frontend-quality, backend-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require all source-validation jobs to pass without DEV access
        env:
          CONTRACTS: ${{ needs.repository-contracts.result }}
          FRONTEND: ${{ needs.frontend-quality.result }}
          BACKEND: ${{ needs.backend-quality.result }}
        run: |
          test "${CONTRACTS}" = success
          test "${FRONTEND}" = success
          test "${BACKEND}" = success
          echo 'PR_SOURCE_VALIDATION=PASS DEV_AUTH=NONE DEV_DEPLOYMENT=NONE'
