# LILITH F9-C erasure executor paths (install as /etc/tmpfiles.d/hermes-forget.conf). The spool is group-writable for
# lilith-forget (the Core API identity only) but not listable; receipts are group-readable; state and epochs are root.
d /run/hermes-forget             0711 root root          -
d /run/hermes-forget/spool       0730 root lilith-forget -
d /var/lib/hermes-forget         0711 root root          -
d /var/lib/hermes-forget/state   0700 root root          -
d /var/lib/hermes-forget/epochs  0700 root root          -
d /var/lib/hermes-forget/receipts 0750 root lilith-forget -
