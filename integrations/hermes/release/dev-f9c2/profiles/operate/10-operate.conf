# F8r3 B-5 OPERATE profile drop-in for hermes-gateway-dev-retention.service: history 24 h (prune --older-than 1 day,
# idle sessions end after 60 min), logs and decisions log 2 days.
[Service]
ExecStart=
ExecStart=/opt/hermes-gateway-dev/current/venv/bin/python -I -B -m hermes_cli.main sessions prune --older-than 1 --include-archived --include-pinned --yes
ExecStart=/usr/sbin/logrotate --state /home/lilith/.hermes-dev/logs/.logrotate.state /opt/hermes-gateway-dev/current/bin/hermes-logrotate.operate.conf
ExecStart=/usr/bin/find /home/lilith/.hermes-dev/logs -xdev -type f -mtime +1 ! -name .logrotate.state -delete
