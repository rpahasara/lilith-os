# Run by hermes-gateway-dev-retention.service as lilith (own state file). DEV logs carry message previews: 7 days.
/home/lilith/.hermes-dev/logs/*.log /home/lilith/.hermes-dev/logs/curator/*.log {
    daily
    rotate 7
    maxage 7
    missingok
    notifempty
    copytruncate
    nocompress
    dateext
}
