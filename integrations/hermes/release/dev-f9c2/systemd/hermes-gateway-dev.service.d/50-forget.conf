# LILITH F9-C: the gateway never starts while an erasure is in progress or failed (fail closed), and never sees the
# erasure spool, state, receipts or epochs (it shares uid lilith with the Core API; this sandbox is the separation).
[Unit]
ConditionPathExists=!/var/lib/hermes-forget/in-progress
# Hold-first: nor while a FORGET intent is recorded (from the moment the Core API writes it, before Privacy acts).
ConditionPathExistsGlob=!/var/lib/hermes-forget/intent/*.intent

[Service]
InaccessiblePaths=-/run/hermes-forget -/var/lib/hermes-forget -/etc/hermes-forget
